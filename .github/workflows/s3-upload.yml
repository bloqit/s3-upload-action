name: S3 Upload

on: push

jobs:
  upload:
    name: Upload using OIDC
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-1

      - name: Upload to S3 via custom action
        uses: ./
        id: upload
        with:
          aws-region: ap-northeast-1
          aws-bucket: ${{ secrets.AWS_BUCKET }}
          file-path: ./README.md
          output-file-url: true
          output-qr-url: true

      - name: Show result
        if: always()
        run: |
          echo "Result: ${{ steps.upload.outputs.result }}"
          echo "File URL: ${{ steps.upload.outputs.file-url }}"
          echo "QR URL: ${{ steps.upload.outputs.qr-url }}"
